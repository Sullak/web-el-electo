backend:
  name: github
  repo: Sullak/web-el-electo
  branch: main
  base_url: https://web-el-electo.pages.dev
  auth_endpoint: /auth

locale: es

media_folder: "images"
public_folder: "/images"

collections:
  - name: "articulos"
    label: "Artículos"
    label_singular: "Artículo"
    folder: "articulos"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Publicado"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Desmarcá para guardar como borrador (no aparece en el sitio)."
      - label: "Título"
        name: "title"
        widget: "string"
      - label: "Autor"
        name: "autor"
        widget: "string"
        default: "Rubén Sahid Jure Yunis"
        required: true
        hint: "Déjalo por defecto, escribe el nombre de un autor invitado, o vacíalo si no quieres mostrar autor."
      - label: "Descripción corta (aparece en la tarjeta del listado)"
        name: "description"
        widget: "string"
      - label: "Subtítulo / lead (debajo del título en el artículo)"
        name: "lead"
        widget: "string"
        required: false
      - label: "Párrafo de apertura (texto introductorio destacado)"
        name: "intro"
        widget: "text"
        required: false
      - label: "Categoría"
        name: "categoria"
        widget: "string"
        hint: "Escribe libremente la categoría (ej: Historia Política, Economía, Independencia, etc.)"
      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Contenido"
        name: "body"
        widget: "markdown"

  - name: "multimedia"
    label: "Multimedia y Entrevistas"
    label_singular: "Entrevista / Disertación"
    folder: "multimedia"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Publicado"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Desmarcá para guardar como borrador (no aparece en el sitio)."
      - label: "Título"
        name: "title"
        widget: "string"
      - label: "Medio de comunicación / Evento"
        name: "medio"
        widget: "string"
        hint: "Ej: Radio Ñandutí, Unicanal, Disertación Encarnación"
      - label: "Tipo de contenido"
        name: "tipo"
        widget: "select"
        options:
          - "Video (YouTube)"
          - "Entrevista Radial"
          - "Nota de Prensa"
          - "Disertación"
        default: "Video (YouTube)"
      - label: "ID de Video de YouTube (opcional)"
        name: "youtube_id"
        widget: "string"
        required: false
        hint: "Solo el ID del video (ej: dQw4w9WgXcQ). Deja vacío si no es un video de YouTube."
      - label: "Enlace externo (URL)"
        name: "url"
        widget: "string"
        required: false
        hint: "URL completa al video, audio o noticia externa."
      - label: "Imagen / Miniatura (opcional)"
        name: "imagen"
        widget: "image"
        required: false
        hint: "Foto o captura para mostrar en la tarjeta. Solo necesaria si no es un video de YouTube."
      - label: "Fecha de publicación / emisión"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Resumen o descripción corta"
        name: "description"
        widget: "text"
        required: false
