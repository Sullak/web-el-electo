backend:
  name: git-gateway
  branch: main

locale: es

media_folder: "images"
public_folder: "/images"

collections:
  - name: "articulos"
    label: "Artículos"
    label_singular: "Artículo"
    folder: "articulos"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"
      - label: "Autor"
        name: "autor"
        widget: "string"
        default: "Rubén Sahid Jure Yunis"
        required: true
        hint: "Déjalo por defecto, escribe el nombre de un autor invitado, o vacíalo si no quieres mostrar autor."
      - label: "Descripción corta (aparece en la tarjeta del listado)"
        name: "description"
        widget: "string"
      - label: "Subtítulo / lead (debajo del título en el artículo)"
        name: "lead"
        widget: "string"
        required: false
      - label: "Párrafo de apertura (texto introductorio destacado)"
        name: "intro"
        widget: "text"
        required: false
      - label: "Categoría"
        name: "categoria"
        widget: "string"
        hint: "Escribe libremente la categoría (ej: Historia Política, Economía, Independencia, etc.)"
      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Contenido"
        name: "body"
        widget: "markdown"